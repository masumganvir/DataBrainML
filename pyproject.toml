[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datawise-ai"
version = "1.0.0"
description = "Autonomous Agentic AutoML, Deep Learning & MLOps Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI/ML Systems Engineering" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/alembic/*"]
