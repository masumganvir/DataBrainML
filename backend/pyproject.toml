[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts", ".venv", "alembic", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []
