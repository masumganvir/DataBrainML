version: "3.9"

services:
  # ------------------------------------------------------------------ #
  #  PostgreSQL (Production Database)
  # ------------------------------------------------------------------ #
  postgres:
    image: postgres:16-alpine
    container_name: datawise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: datawise_db
      POSTGRES_USER: datawise
      POSTGRES_PASSWORD: datawise_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datawise -d datawise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  #  Redis (Rate Limiting, Caching, Locks, Queues)
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    container_name: datawise_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  #  MinIO (S3-Compatible Object Storage)
  # ------------------------------------------------------------------ #
  minio:
    image: minio/minio:latest
    container_name: datawise_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------------ #
  #  Backend (FastAPI API Server)
  # ------------------------------------------------------------------ #
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: datawise_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://datawise:datawise_pass@postgres:5432/datawise_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: datawise
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_change_in_prod}
      CORS_ORIGINS: http://localhost:80,http://frontend:80
      STORAGE_PATH: /app/data/uploads
      ARTIFACTS_PATH: /app/artifacts
      RATE_LIMIT_ENABLED: "true"
    volumes:
      - uploads_data:/app/data/uploads
      - artifacts_data:/app/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ #
  #  Background Worker (Celery / Redis Job Queue Runner)
  # ------------------------------------------------------------------ #
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: datawise_worker
    restart: unless-stopped
    command: python -c "import asyncio; from app.workers.runner import BackgroundWorker; asyncio.run(BackgroundWorker().run_loop())"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://datawise:datawise_pass@postgres:5432/datawise_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: datawise
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_change_in_prod}
      STORAGE_PATH: /app/data/uploads
      ARTIFACTS_PATH: /app/artifacts
    volumes:
      - uploads_data:/app/data/uploads
      - artifacts_data:/app/artifacts

  # ------------------------------------------------------------------ #
  #  Frontend (React + Vite → Nginx)
  # ------------------------------------------------------------------ #
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
    container_name: datawise_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # ------------------------------------------------------------------ #
  #  Observability: Prometheus (Optional profile: monitoring)
  # ------------------------------------------------------------------ #
  prometheus:
    image: prom/prometheus:latest
    container_name: datawise_prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Observability: Grafana (Optional profile: monitoring)
  # ------------------------------------------------------------------ #
  grafana:
    image: grafana/grafana:latest
    container_name: datawise_grafana
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    restart: unless-stopped

# ------------------------------------------------------------------ #
#  Persistent Volumes
# ------------------------------------------------------------------ #
volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
  artifacts_data:
